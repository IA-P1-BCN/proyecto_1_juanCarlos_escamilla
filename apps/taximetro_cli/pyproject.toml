[project]
name = "taximetro-cli"
version = "0.1.0"
description = "CLI + TUI del taxímetro — presentación sobre el paquete taximetro"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "textual>=1.0",
    "taximetro",
]

[project.scripts]
taximetro-cli = "taximetro_cli.main:main"
taximetro-tui = "taximetro_cli.main:main_tui"

[tool.uv.sources]
taximetro = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taximetro_cli"]
