[project]
name = "taximetro-billing"
version = "0.1.0"
description = "Contexto billing — Tarifa vigente y cálculo del Importe por tramos"
requires-python = ">=3.12"
dependencies = ["taximetro-kernel"]

[tool.uv.sources]
taximetro-kernel = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taximetro_billing"]
