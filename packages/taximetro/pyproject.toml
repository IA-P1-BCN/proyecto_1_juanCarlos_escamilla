[project]
name = "taximetro"
version = "0.1.0"
description = "Capa de aplicación del taxímetro — el turno (ServicioTaximetro) y el histórico"
requires-python = ">=3.12"
dependencies = [
    "taximetro-kernel",
    "taximetro-ride",
    "taximetro-billing",
    "taximetro-log",
]

[tool.uv.sources]
taximetro-kernel = { workspace = true }
taximetro-ride = { workspace = true }
taximetro-billing = { workspace = true }
taximetro-log = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taximetro"]
