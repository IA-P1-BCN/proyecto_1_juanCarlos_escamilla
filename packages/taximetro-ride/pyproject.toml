[project]
name = "taximetro-ride"
version = "0.1.0"
description = "Contexto ride — ciclo de vida de la Carrera y máquina de estados del vehículo"
requires-python = ">=3.12"
dependencies = ["taximetro-kernel"]

[tool.uv.sources]
taximetro-kernel = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taximetro_ride"]
