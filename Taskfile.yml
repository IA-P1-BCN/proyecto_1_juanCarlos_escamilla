version: "3"

tasks:
  setup:
    desc: Instala el workspace y los hooks de pre-commit (una vez tras clonar)
    cmds:
      - uv sync --all-packages
      - uv run pre-commit install

  run-tui:
    desc: Arranca la TUI a pantalla completa (taximetro-tui)
    cmds:
      - uv run taximetro-tui

  bin:
    desc: Compila el binario nativo en bin/taximetro (PyInstaller, macOS arm64)
    cmds:
      - uv run pyinstaller apps/taximetro_cli/taximetro.spec --noconfirm
      - mkdir -p bin && cp dist/taximetro bin/taximetro

  format:
    desc: Formatea el código con ruff
    cmds:
      - uv run ruff format .

  lint:
    desc: Lint del workspace con ruff
    cmds:
      - uv run ruff check .

  typecheck:
    desc: Comprueba tipos con mypy
    cmds:
      - uv run mypy

  test:
    desc: Ejecuta la suite de tests
    cmds:
      - uv run pytest

  test-cov:
    desc: Suite con cobertura (por paquete, con líneas que faltan)
    cmds:
      - uv run pytest --cov --cov-report=term-missing

  allure:
    desc: Genera resultados Allure en allure-results (informe HTML en la CI)
    cmds:
      - uv run pytest --alluredir=allure-results --clean-alluredir

  check:
    desc: Todo lo que exige la CI en un PR (formato + lint + tipos + tests)
    cmds:
      - uv run ruff format --check .
      - uv run ruff check .
      - uv run mypy
      - uv run pytest
