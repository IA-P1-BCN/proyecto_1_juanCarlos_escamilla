name: Allure Report (Pages)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: allure-gh-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  allure-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-suffix: "uv-monorepo"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: uv sync --all-packages --all-extras --frozen

      - name: Run Pytest with Allure
        run: uv run pytest --alluredir=allure-results
        continue-on-error: true

      - name: Coverage Badge (solo main)
        if: github.event_name == 'push'
        run: |
          uv run pytest --cov --cov-report=term >/dev/null
          uv run coverage json -o coverage.json
          python3 - <<'PY'
          import json
          import pathlib

          datos = json.load(open("coverage.json"))
          pct = round(datos["totals"]["percent_covered"])
          color = "brightgreen" if pct >= 90 else "yellow" if pct >= 70 else "red"
          badge = {
              "schemaVersion": 1,
              "label": "coverage",
              "message": f"{pct}%",
              "color": color,
          }
          pathlib.Path("allure-history").mkdir(exist_ok=True)
          json.dump(badge, open("allure-history/coverage.json", "w"))
          PY

      - name: Set Report Variables
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "pr_num=main" >> "$GITHUB_OUTPUT"
            echo "subfolder=main" >> "$GITHUB_OUTPUT"
          else
            PR_NUM="${{ github.event.pull_request.number }}"
            echo "pr_num=$PR_NUM" >> "$GITHUB_OUTPUT"
            echo "subfolder=pr-$PR_NUM" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Allure Report with History
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          allure_history: allure-history
          gh_pages: gh-pages
          subfolder: ${{ steps.vars.outputs.subfolder }}
          keep_reports: 20

      - name: Índice de informes (raíz de Pages)
        run: |
          python3 - <<'PY'
          import pathlib
          import subprocess

          # Fuente de verdad: lo que ya vive en gh-pages (el clone del action
          # solo contiene el informe de ESTA ejecución) + lo generado ahora.
          en_branch = subprocess.run(
              ["git", "ls-tree", "--name-only", "origin/gh-pages"],
              capture_output=True,
              text=True,
          ).stdout.split()
          locales = [p.name for p in pathlib.Path("allure-history").glob("pr-*")]
          numeros = {n.split("-")[1] for n in en_branch if n.startswith("pr-")}
          numeros |= {n.split("-")[1] for n in locales}
          filas = ['<li><a href="main/">main — último estado</a></li>']
          filas += [
              f'<li><a href="pr-{n}/">PR #{n}</a></li>' for n in sorted(numeros, key=int, reverse=True)
          ]
          html = (
              "<!DOCTYPE html>\n"
              '<html lang="es"><head><meta charset="utf-8">'
              "<title>Taxímetro — informes Allure</title>"
              '<meta name="viewport" content="width=device-width, initial-scale=1">'
              "<style>body{font-family:system-ui,sans-serif;background:#0f172a;"
              "color:#f8fafc;max-width:40rem;margin:3rem auto;padding:0 1rem}"
              "h1{color:#facc15}a{color:#facc15;text-decoration:none}"
              "li{margin:.4rem 0}p{color:#94a3b8}</style></head>\n"
              "<body><h1>🚕 Informes Allure</h1>"
              "<p>Un informe por PR y el estado de main — se conservan los últimos 20.</p>"
              f"<ul>{''.join(filas)}</ul></body></html>\n"
          )
          pathlib.Path("allure-index.html").write_text(html, encoding="utf-8")
          PY
          # el action (Docker) deja index.html root-owned: se sobreescribe con sudo
          sudo install -m 0644 allure-index.html allure-history/index.html

      - name: Deploy Report to gh-pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          keep_files: true

      - name: Comment PR Report URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNum = "${{ steps.vars.outputs.pr_num }}";
            const subfolder = "${{ steps.vars.outputs.subfolder }}";

            const reportUrl = `https://${owner}.github.io/${repo}/${subfolder}/`;
            const commentBody = `📊 **Allure Test Report Updated for PR #${prNum}**\n\nView interactive test results:\n${reportUrl}`;

            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.data.find(c => c.body.includes('Allure Test Report Updated'));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            }
