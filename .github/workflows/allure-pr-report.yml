name: Allure Report (Pages)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: allure-gh-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  allure-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-suffix: "uv-monorepo"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: uv sync --all-packages --all-extras --frozen

      - name: Run Pytest with Allure
        run: uv run pytest --alluredir=allure-results
        continue-on-error: true

      - name: Coverage Badge (solo main)
        if: github.event_name == 'push'
        run: |
          uv run pytest --cov --cov-report=term >/dev/null
          uv run coverage json -o coverage.json
          python3 - <<'PY'
          import json
          import pathlib

          datos = json.load(open("coverage.json"))
          pct = round(datos["totals"]["percent_covered"])
          color = "brightgreen" if pct >= 90 else "yellow" if pct >= 70 else "red"
          badge = {
              "schemaVersion": 1,
              "label": "coverage",
              "message": f"{pct}%",
              "color": color,
          }
          pathlib.Path("allure-history").mkdir(exist_ok=True)
          json.dump(badge, open("allure-history/coverage.json", "w"))
          PY

      - name: Set Report Variables
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "pr_num=main" >> "$GITHUB_OUTPUT"
            echo "subfolder=main" >> "$GITHUB_OUTPUT"
          else
            PR_NUM="${{ github.event.pull_request.number }}"
            echo "pr_num=$PR_NUM" >> "$GITHUB_OUTPUT"
            echo "subfolder=pr-$PR_NUM" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Allure Report with History
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          allure_history: allure-history
          gh_pages: gh-pages
          subfolder: ${{ steps.vars.outputs.subfolder }}
          keep_reports: 20

      - name: Deploy Report to gh-pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          keep_files: true

      - name: Comment PR Report URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNum = "${{ steps.vars.outputs.pr_num }}";
            const subfolder = "${{ steps.vars.outputs.subfolder }}";

            const reportUrl = `https://${owner}.github.io/${repo}/${subfolder}/`;
            const commentBody = `📊 **Allure Test Report Updated for PR #${prNum}**\n\nView interactive test results:\n${reportUrl}`;

            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.data.find(c => c.body.includes('Allure Test Report Updated'));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            }
